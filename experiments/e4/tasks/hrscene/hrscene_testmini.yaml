dataset_path: Wenliang04/HRScene
dataset_name: realworld_combined
task: hrscene_testmini
test_split: testmini
output_type: generate_until
doc_to_visual: !function utils.hrscene_doc_to_visual
doc_to_text: !function utils.hrscene_doc_to_text
doc_to_target: !function utils.hrscene_doc_to_target
process_results: !function utils.hrscene_process_results
generation_kwargs:
  max_new_tokens: 100
  do_sample: false
  num_beams: 1
metric_list:
  - metric: hrscene_accuracy
    aggregation: !function utils.mean
    higher_is_better: true
