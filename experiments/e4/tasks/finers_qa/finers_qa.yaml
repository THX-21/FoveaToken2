dataset_path: Jiazuo98/Finers-4k-benchmark
task: finers_qa
test_split: test
output_type: generate_until
doc_to_visual: !function utils.finers_doc_to_visual
doc_to_text: !function utils.finers_doc_to_text
doc_to_target: !function utils.finers_doc_to_target
process_results: !function utils.finers_process_results
generation_kwargs:
  max_new_tokens: 64
  do_sample: false
  num_beams: 1
metric_list:
  - metric: finers_qa_accuracy
    aggregation: !function utils.mean
    higher_is_better: true
